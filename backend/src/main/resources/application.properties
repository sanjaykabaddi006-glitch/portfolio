# =====================================================
# SAHARA KABADDI BACKEND — H2 file-based DB (zero credentials)
# To swap to MySQL later: replace spring.datasource.* with
#   spring.datasource.url=jdbc:mysql://localhost:3306/kabaddi_db
#   spring.datasource.username=root
#   spring.datasource.password=YOUR_PASSWORD
#   spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# and replace the h2 runtime dep with mysql-connector-j.
# =====================================================
spring.application.name=sahara-kabaddi-backend
server.port=8080
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres.nqwfdmjyhdfltcdfhgsx
spring.datasource.password=Sanjay@1801
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart upload limits (configurable, per spec)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Photo storage root (local object storage; swap for Cloudinary/S3 later)
app.storage.root=./uploads
app.jwt.secret=SAHARA_KABADDI_JWT_SECRET_CHANGE_ME_IN_PRODUCTION_0123456789
app.jwt.expiration-ms=86400000

# Seed placeholder achievements on first run (set false after replacing real content)
app.seed.enabled=true
